# Blueshift: Entropy (SecretPlusMid) re-aimed at minor antags, at Entropy's chaos rate.
#
# Roundstart: the first pick is a core antag (traitor, vampire, blood brothers) or, less often,
# one major (revs, blood cult, cosmic cult, rarely nukies). Follow-up picks are core antags,
# then aggressive ones (ling, heretic), then quiet ones (thief, devil, silicon liberation) least.
# Majors only sit in the first-pick table, so a round never gets two.
# Changeling and Heretic exclude each other (Blueshift copies with their own incompatibleModes).
#
# Two schedulers split the midround:
#   - BlueshiftScheduler (Secret+): roundstart antags, plus every non-antag midround event
#     (maintenance, chaotic, neutral, hostile-spawn, interference, cargo gifts). No friendly spawns
#     or psionic events.
#   - BlueshiftAntagScheduler (basic scheduler): one midround antag event about 25 minutes in, then
#     one every 30-40 minutes, by weight: traitor, vampire or bounty hunter, or more
#     rarely hitman, malf AI, tunnel clown, mime assassin, dark priest, borer, paradox clone or rat king.
#     The interval itself spaces the antags. Midround antag rules last the whole round
#     (duration: null), so each one fires at most once.

# Midround pool for Secret+: no antags, those come from BlueshiftAntagScheduler.

- type: entityTable
  id: BlueshiftEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: BlueshiftCalmEventsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable

# BasicCalmEventsTable without DerelictCyborgSyndicateSpawn (a ghost-role antag), with the malign rift
# twice as likely and the goblins toned down. Keep in sync with BasicCalmEventsTable.
- type: entityTable
  id: BlueshiftCalmEventsTable
  table: !type:AllSelector
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: GreytideVirus
    - id: IonStorm
    - id: JobDistributionError
    - id: KudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: RandomVirus
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SlimesSpawn
    - id: SolarFlare
    - id: SnakeSpawn
    - id: SpiderClownSpawn
    - id: SpiderSpawn
    - id: VentClog
    - id: TidemindDevelop
    - id: MothroachSpawn
    - id: BlueshiftMalignRiftSpawn
    - id: BlueshiftFloorGoblinMidRound
    - id: BlueshiftClownGoblinMigration
    - id: EeepEvent
    # From SpicyPestEventsTable; its KingRatMigration moved to the antag table below.
    - id: SnailMigration

# Midround antags for BlueshiftAntagScheduler, picked by StationEvent weight: the core ones at 20 each,
# the extras at their usual weights. Traitors come from TraitorMidround only (not SleeperAgents), so
# every midround traitor uses the Traitor preference and ban.
- type: entityTable
  id: BlueshiftAntagEventsTable
  table: !type:AllSelector
    children:
    - id: BlueshiftTraitorMidround
    - id: BlueshiftVampireMidround
    - id: BlueshiftBountyHunterSpawn
      conditions:
      - !type:BountyHunterTargetCondition
    - id: HitmanShuttle
    - id: MalfAiMidround
      conditions:
      - !type:MalfAiAvailableCondition
    - id: TunnelClownMidround
    - id: MimeAssassinMidround
    - id: BlueshiftDarkPriestMidround
    - id: BorerSpawn
    - id: ParadoxCloneSpawn
    # Always puts up a rat king ghost role (VentCrittersRule spawns one specialEntry and ignores its prob).
    - id: KingRatMigration

# First midround antag 25-27 min in, then one every 30-40 min.
- type: entity
  id: BlueshiftAntagScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1500
    minMaxEventTiming:
      min: 1800
      max: 2400
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftAntagEventsTable

# The core antags at weight 20 and earliestStart 15 (the scheduler's first pick comes at ~25 min anyway).
# Component fields merge per key with the parent, so each copy only sets what differs.

# Midround traitors get 75 TC instead of the roundstart 50: they join later and have less time to earn
# through contracts. No start delay (TraitorMidround inherits the roundstart Traitor's 240-420 s), so
# traitors are picked when the interception announcement plays.
- type: entity
  id: BlueshiftTraitorMidround
  parent: TraitorMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    delay:
      min: 0
      max: 0
  - type: TraitorRule
    startingBalance: 75
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftVampireMidround
  parent: VampireMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftBountyHunterSpawn
  parent: BountyHunterSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 20

# Dark priest 5x rarer than the tunnel clown (1.5) instead of upstream's 30x (0.05).
# StationEvent fields merge with the parent, so only the weight is overridden.
- type: entity
  id: BlueshiftDarkPriestMidround
  parent: DarkPriestMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 0.3

# Goblins: upstream runs each at weight 15, up to twice a round, and they cost almost no chaos, so in
# Blueshift they landed in over 80% of rounds. Weight 2.5 and once a round each: about 30% of rounds.
- type: entity
  id: BlueshiftFloorGoblinMidRound
  parent: FloorGoblinMidRound
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.5
    maxOccurrences: 1

- type: entity
  id: BlueshiftClownGoblinMigration
  parent: ClownGoblinMigration
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.5
    maxOccurrences: 1

# Malign rift at twice the base weight (0.4).
- type: entity
  id: BlueshiftMalignRiftSpawn
  parent: MalignRiftSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 15
    weight: 0.8
    eventType: Neutral
    startAnnouncement: cosmiccult-announce-tier2-warning
    startAnnouncementColor: "#cae8e8"
    startAudio:
      path: /Audio/_DV/CosmicCult/tier2.ogg

# Roundstart

# Roundstart antag sizes for Blueshift. AntagSelection `definitions` is a list, which inheritance
# replaces whole, so each copy repeats its parent's definition with only playerRatio changed.
# Keep them in sync with Changeling, Heretic, Thief and Vampire. Traitor uses the standard rule (1 per 10).
# Ling and heretic are capped at one each.

- type: entity
  id: BlueshiftChangeling
  parent: Changeling
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: changeling-roundend-name
    definitions:
    - prefRoles: [ Changeling ]
      max: 1 # Changeling: 4
      playerRatio: 15 # Changeling: 12
      chaosScore: 200
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      lateJoinAdditional: true
      mindRoles:
      - MindRoleChangeling

- type: entity
  id: BlueshiftThief
  parent: Thief
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 10 # Thief: 15
      chaosScore: 100
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      components:
      - type: Pacified
      - type: Thieving
        stripTimeReduction: 2
        stealthy: true
      mindRoles:
      - MindRoleThief
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"

# Max stays 1, so the ratio only matters if the max is ever raised. Half the usual chaos cost, so a
# vampire-first round has budget left for more than blood brothers.
- type: entity
  id: BlueshiftVampire
  parent: Vampire
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: vampire-roundend-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 1
      playerRatio: 10 # Vampire: 5
      chaosScore: 100 # Vampire: 200
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
        - Changeling
        - BibleUser
      lateJoinAdditional: true
      mindRoles:
      - MindRoleVampire

# One heretic at most. Also its own id, so the ling/heretic exclusion below can name both Blueshift copies.
- type: entity
  id: BlueshiftHeretic
  parent: Heretic
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: heretic-roundend-name
    definitions:
    - prefRoles: [ Heretic ]
      max: 1 # Heretic: 3
      playerRatio: 15
      chaosScore: 250
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic

# incompatibleModes is keyed by the picked rule's id: these mirror Changeling's and Heretic's entries.
- type: incompatibleModes
  id: BlueshiftChangeling
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult

- type: incompatibleModes
  id: BlueshiftHeretic
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult
  - Changeling
  - BlueshiftChangeling

# Cosmic cult from 20 connected players instead of 25, in Blueshift only.
- type: entity
  id: BlueshiftCosmicCult
  parent: CosmicCult
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20

# Same exclusions as CosmicCult (incompatibleModes is keyed by the picked rule's id).
- type: incompatibleModes
  id: BlueshiftCosmicCult
  modes:
  - Nukeops
  - Honkops
  - Zombie
  - Revolutionary
  - BlobGameMode
  - CosmicCult
  - BlueshiftCosmicCult
  - Heretic
  - BlueshiftHeretic

# First pick. Core antags lead; majors are rarer and need 15-25 players at roundstart (their minPlayers).
- type: weightedRandom
  id: BlueshiftPrimary
  weights:
    Traitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    # majors at 0.75x of the first draft (0.07 / 0.05 / 0.05 / 0.02)
    Revolutionary: 0.0525
    BloodCult: 0.0375
    BlueshiftCosmicCult: 0.0375
    Nukeops: 0.015

# Follow-up picks while chaos budget is left.
- type: weightedRandom
  id: BlueshiftRoundstart
  weights:
    # core
    Traitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    # aggressive: likelier than the quiet group. Ling and heretic exclude each other (incompatibleModes above).
    BlueshiftChangeling: 0.045
    BlueshiftHeretic: 0.045
    # quiet: cheap in chaos, so they pass the budget roll easily; keep their weights low
    BlueshiftThief: 0.015
    Devil: 0.01
    SiliconLiberation: 0.01

# Scheduler

- type: entity
  id: BlueshiftScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 6 # Entropy: 11. Per connected player, and the whole lobby counts
    maxStartingChaos: 12 # Entropy: 22
    livingChaosChange: -0.018 # Entropy's rate
    deadChaosChange: 0.048
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    # Entropy: 180-450 s. Stretched because antags no longer take any of these picks.
    eventIntervalMin: 210
    eventIntervalMax: 525
    primaryAntagsWeightTable: BlueshiftPrimary
    roundStartAntagsWeightTable: BlueshiftRoundstart
    disallowedEvents:
    - FriendlySpawn
    - Psionic
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftEventsTable
