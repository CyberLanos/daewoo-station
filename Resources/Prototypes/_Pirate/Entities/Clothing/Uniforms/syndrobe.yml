# Insulated tactical turtleneck ------------------------------------------
# /obj/item/clothing/under/syndicate/coldres
# armour: /datum/armor/clothing_under/syndicate/coldres
#   melee 20, bullet 10, energy 5, fire 25, acid 25
# cold_protection down to FIRE_SUIT_MIN_TEMP_PROTECT (60K); SS14 models that
# as a cooling coefficient, so it reuses the winter coat's value.
- type: entity
  parent: [UnsensoredClothingUniformBase, ClothingUniformFoldableBase, BaseSyndicateContraband]
  id: ClothingUniformJumpsuitSyndieInsulated
  name: insulated tactical turtleneck
  description: A nondescript and slightly suspicious-looking turtleneck with digital camouflage cargo pants. The interior has been padded with special insulation for both warmth and protection.
  components:
  # The source gives coldres no icon_state of its own, so it wears the plain
  # tactical turtleneck sprite - which is pixel-identical to SS14's operative
  # jumpsuit, so it reuses that .rsi instead of duplicating the art.
  - type: Sprite
    sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/Syndicate/operative.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/Syndicate/operative.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.9
        Shock: 0.95
        Heat: 0.75
        Caustic: 0.75
  - type: TemperatureProtection
    heatingCoefficient: 1.1
    coolingCoefficient: 0.1
  - type: StaticPrice
    price: 50
