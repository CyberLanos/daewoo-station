# Uniforms stocked by the SynDrobe, ported from NovaSector (SS13) at commit
# 9d5bb13a76866960c76cb78217e7436e65239268.
#
# SS13 armour is a percentage reduction, so every value below is
# `coefficient = 1 - percent / 100` off the source armour datum:
#   melee -> Blunt + Slash, bullet -> Piercing, laser/fire -> Heat,
#   energy -> Shock, acid -> Caustic, bomb -> ExplosionResistance.
# SS13's `wound` and `bio` armour have no SS14 analogue and are dropped.
#
# All of these are NO_SENSORS in SS13, hence UnsensoredClothingUniformBase.
# The ones SS13 marks can_adjust get ClothingUniformFoldableBase, using the
# source's "_d" (adjusted) worn state as the folded sprite.

# Tactical turtleneck / skirtleneck ---------------------------------------
# /obj/item/clothing/under/syndicate/nova/tactical
# armour: /datum/armor/clothing_under/syndicate - melee 10, fire 50, acid 40
- type: entity
  parent: [UnsensoredClothingUniformBase, ClothingUniformFoldableBase, BaseSyndicateContraband]
  id: ClothingUniformJumpsuitSyndieTactical
  name: tactical turtleneck
  description: A snug syndicate-red turtleneck with charcoal-black cargo pants. Good luck arguing allegiance with this on.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Uniforms/SynDrobe/tacticalturtleneck.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Uniforms/SynDrobe/tacticalturtleneck.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Heat: 0.5
        Caustic: 0.6
  - type: StaticPrice
    price: 50

