# /obj/item/clothing/shoes/combat/coldres
# Plain combat boots plus cold_protection down to FIRE_SUIT_MIN_TEMP_PROTECT
# (60K). SS14 models that as a cooling coefficient, so it reuses the value
# from ClothingShoesBaseWinterBoots. Same sprite as the base combat boots in
# the source, so it reuses the SS14 combat boot .rsi.
- type: entity
  parent: ClothingShoesBootsCombat
  id: ClothingShoesBootsCombatInsulated
  name: insulated combat boots
  description: High speed, low drag combat boots, now with an added layer of insulation.
  components:
  - type: TemperatureProtection
    heatingCoefficient: 1.025
    coolingCoefficient: 0.25
