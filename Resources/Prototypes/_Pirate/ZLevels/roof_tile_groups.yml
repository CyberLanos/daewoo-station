# Roof tile groups for the multiz roof generator. The generator counts the walls on the deck it roofs over;
# the first group to reach minWalls supplies the roof tiles, otherwise the roof falls back to copying the
# deck's subfloor. Add a group per base wall material.
#
# walls and diagonalWalls both count towards a group's own minWalls. diagonalWalls additionally says "this is a
# half tile", and that part is shared: a deck roofed as one material still gets a chamfer over a diagonal window
# of another, drawn in the winning group's art. So list a prototype under the group whose material it is, and
# every group will read its shape correctly.

- type: roofTileGroup
  id: Shuttle
  minWalls: 10
  walls:
  - WallShuttle
  diagonalWalls:
  - WallShuttleDiagonal
  - ShuttleWindowDiagonal
  tile: ShuttleRoof
  diagonalTiles:
    NorthEast: ShuttleRoofDiagonalNE
    NorthWest: ShuttleRoofDiagonalNW
    SouthEast: ShuttleRoofDiagonalSE
    SouthWest: ShuttleRoofDiagonalSW

- type: roofTileGroup
  id: Plastitanium
  minWalls: 10
  walls:
  - WallPlastitanium
  diagonalWalls:
  - WallPlastitaniumDiagonal
  - PlastitaniumWindowDiagonal
  tile: PlastitaniumRoof
  diagonalTiles:
    NorthEast: PlastitaniumRoofDiagonalNE
    NorthWest: PlastitaniumRoofDiagonalNW
    SouthEast: PlastitaniumRoofDiagonalSE
    SouthWest: PlastitaniumRoofDiagonalSW

- type: roofTileGroup
  id: Mining
  minWalls: 10
  walls:
  - WallMining
  - MiningWindow
  diagonalWalls:
  - WallMiningDiagonal
  - MiningWindowDiagonal
  tile: MiningRoof
  diagonalTiles:
    NorthEast: MiningRoofDiagonalNE
    NorthWest: MiningRoofDiagonalNW
    SouthEast: MiningRoofDiagonalSE
    SouthWest: MiningRoofDiagonalSW
