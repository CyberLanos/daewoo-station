# The three Lavaland base ghost roles all spawn with a stock SyndiPDA, which holds a plain
# SyndicateIDCard. That card never sets jobIcon, so every one of them showed up on a security
# or syndicate HUD as the blank JobIconUnknown. These give each role its own card so the base
# reads as a chain of command instead of three question marks.

- type: entity
  parent: SyndicateIDCard
  id: SyndicateIDCardLavalandSoldier
  suffix: Lavaland, Soldier
  components:
  - type: IdCard
    jobTitle: job-name-syndicate-soldier
    jobIcon: JobIconSyndicateSoldier

- type: entity
  parent: SyndicateIDCard
  id: SyndicateIDCardLavalandMarshal
  suffix: Lavaland, Marshal
  components:
  - type: IdCard
    jobTitle: job-name-syndicate-marshal
    jobIcon: JobIconSyndicateMarshal

- type: entity
  parent: SyndicateIDCard
  id: SyndicateIDCardLavalandTeamLeader
  suffix: Lavaland, Team Leader
  components:
  - type: IdCard
    jobTitle: job-name-syndicate-team-leader
    jobIcon: JobIconSyndicateTeamLeader

# PDA shells so the starting gear can keep handing out a single id slot item.

- type: entity
  parent: SyndiPDA
  id: SyndiPDALavalandSoldier
  suffix: Lavaland, Soldier
  components:
  - type: Pda
    id: SyndicateIDCardLavalandSoldier

- type: entity
  parent: SyndiPDA
  id: SyndiPDALavalandMarshal
  suffix: Lavaland, Marshal
  components:
  - type: Pda
    id: SyndicateIDCardLavalandMarshal

- type: entity
  parent: SyndiPDA
  id: SyndiPDALavalandTeamLeader
  suffix: Lavaland, Team Leader
  components:
  - type: Pda
    id: SyndicateIDCardLavalandTeamLeader
