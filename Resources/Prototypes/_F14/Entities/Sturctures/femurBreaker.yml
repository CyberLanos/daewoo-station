- type: entity
  id: FemurBreaker
  name: femur breaker
  description: >-
    A hydraulic press repurposed to produce a specific auditory stimulus
    known to attract SCP-106. Requires a human subject to be in position.
    Use only as a last resort.
  components:
  - type: FemurBreaker
    activationSound:
      path: /Audio/_F14/Effects/femur_breaker.ogg
      params:
        volume: 5       
    victimRange: 1.2
    activationDelay: 1.5
    
  - type: Physics
    bodyType: Static
    
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - WallLayer
        mask:
        - MobMask
        
  - type: Anchorable
  - type: Pullable
  - type: InteractionOutline
  
  - type: Appearance
  
  - type: GenericVisualizer
    visuals:
      enum.FemurBreakerVisuals.State:
        BaseLayer:
          enum.FemurBreakerState.Idle:       { state: idle }
          enum.FemurBreakerState.Activating: { state: activating }
          enum.FemurBreakerState.Used:       { state: used }

  - type: Sprite
    sprite: Textures/_F14/Structures/femur_breaker.rsi   
    layers:
    - map: [ "BaseLayer" ]
      state: idle
      
  - type: Examine
  
  - type: Damageable
    damageContainer: Inorganic
    
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]