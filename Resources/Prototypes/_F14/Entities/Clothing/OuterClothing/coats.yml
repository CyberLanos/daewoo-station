- type: entity
  parent: [ClothingOuterStorageBase, AllowSuitStorageClothing, ClothingOuterArmorBase]
  id: ClothingOuterCoatO5
  name: O5 Coat
  description: It's looks expensive
  components:
  - type: Sprite
    sprite: _F14/Clothing/OuterClothing/Coates/O5.rsi
  - type: Clothing
    sprite: _F14/Clothing/OuterClothing/Coates/O5.rsi
  - type: StorageFill
    contents:
    - id: SmokingPipeFilledTobacco
    - id: FlippoEngravedLighter
  - type: ExplosionResistance
    damageCoefficient: 1 #its a coat. it doesnt do shit
  - type: Armor # Woundmed
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    - Leg
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.7

