- type: entity
  parent: [ ClothingOuterBaseLarge, BaseMajorContraband, AllowSuitStorageClothing ]
  id: GuardArmour
  name: Guard armour
  description: Good piece of armor that can protect against most attacks, yet it has some weakpoints.
  components:
  - type: Sprite
    sprite: _F14/Clothing/OuterClothing/Armor/guard_armor.rsi
  - type: Clothing
    sprite: _F14/Clothing/OuterClothing/Armor/guard_armor.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    traumaDeductions:
      Dismemberment: 0.33
      OrganDamage: 0.33
      BoneDamage: 0.33
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.60
        Piercing: 0.60
        Heat: 0.60
  - type: GroupExamine
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  - type: StaminaResistance
    damageCoefficient: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.90
    sprintModifier: 0.90

