- type: entity
  name: SCP-106
  id: MobSCP106
  parent: SimpleMobBase
  description: 
    You see a big and black figure that appears to be an elderly humanoid,
    with a general appearance of advanced decomposition.
  components:
  - type: SCP106
  - type: Damageable
    damageModifierSet: SCP106Invincible
  - type: MobState
    allowedStates:
      - Alive
  - type: MobThresholds
    thresholds:
      0: Alive
  - type: Hunger
    enabled: false
  - type: Thirst
    enabled: false
  - type: MeleeWeapon
    damage:
      types:
        Caustic: 25
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/_F14/Effects/SCP/scp106_touch.ogg
      params:
        volume: -3
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: Sprite
    netsync: false
    sprite: /Textures/_F14/Mobs/scp106.rsi
    layers:
    - map: [ "enum.SCP106VisualLayers.Base" ]
      state: alive
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: Metabolizer
    enabled: false