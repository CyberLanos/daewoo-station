# SPDX-License-Identifier: AGPL-3.0-or-later
# TEMPORARY diagnostic workflow: runs the whole EntityTest fixture exactly like the real
# "Entity integration tests" CI shard, while sampling system memory. Delete before merging.

name: ZDiag EntityTest

on:
  push:
    branches: [ 'zdiag/**' ]
  workflow_dispatch:

jobs:
  zdiag:
    name: zdiag full EntityTest
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Machine info
      run: |
        nproc
        free -m
        swapon --show || true

    - name: Run full EntityTest
      timeout-minutes: 100
      run: |
        export DOTNET_gcServer=1
        (
          while true; do
            echo "MEMSAMPLE t=$(date +%s) $(free -m | awk '/^Mem:/{printf "used=%s avail=%s", $3, $7}') $(free -m | awk '/^Swap:/{printf " swap_used=%s", $3}')"
            sleep 15
          done
        ) &
        SAMPLER=$!
        start=$(date +%s)
        set +e
        dotnet test --no-build --configuration DebugOpt \
          Content.IntegrationTests/Content.IntegrationTests.csproj \
          --filter "FullyQualifiedName~Content.IntegrationTests.Tests.EntityTest" \
          --logger "console;verbosity=detailed" \
          -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed
        rc=$?
        set -e
        kill $SAMPLER 2>/dev/null || true
        echo "ZDIAG_RESULT full exit=$rc elapsed_s=$(( $(date +%s) - start ))"
        exit $rc
