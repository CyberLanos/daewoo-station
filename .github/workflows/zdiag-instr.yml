# TEMPORARY diagnostic workflow. Delete before merging.

name: ZDiag Instrumented

on:
  push:
    branches: [ 'zdiag-instr/**' ]
  workflow_dispatch:

jobs:
  zdiag:
    name: instr ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - ZDiagSameSpotProfile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4.2.2
    - run: git submodule update --init --recursive
    - uses: space-wizards/submodule-dependency@v0.1.5
    - run: cd RobustToolbox/ && git submodule update --init --recursive
    - uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x
    - run: dotnet restore
    - run: dotnet build --configuration DebugOpt --no-restore /m
    - name: Run ${{ matrix.test }}
      timeout-minutes: 60
      run: |
        export DOTNET_gcServer=1
        (while true; do echo "MEMSAMPLE t=$(date +%s) $(free -m | awk '/^Mem:/{printf "used=%s avail=%s", $3, $7}')" >> mem.log; sleep 10; done) &
        S=$!
        set +e
        timeout 55m dotnet test --no-build --configuration DebugOpt \
          Content.IntegrationTests/Content.IntegrationTests.csproj \
          --filter "FullyQualifiedName~ZDiagEntityTest.${{ matrix.test }}" \
          --logger "console;verbosity=detailed" > run.log 2>&1
        rc=$?
        set -e
        kill $S 2>/dev/null || true
        echo "=================== ZDIAG progress lines"
        grep -a "ZDIAG" run.log | tail -100 || true
        echo "=================== memory"
        cat mem.log || true
        echo "=================== error-ish lines"
        grep -aiE "\[ERRO\]|\[WARN\] .*assert|exception|Assert|Failed !|System\..*Exception" run.log | tail -120 || true
        echo "=================== tail"
        tail -c 40000 run.log || true
        echo "ZDIAG_EXIT=$rc log_lines=$(wc -l < run.log)"
    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: run-log-${{ matrix.test }}-${{ github.ref_name }}
        path: |
          run.log
          mem.log
        retention-days: 5
        compression-level: 9
