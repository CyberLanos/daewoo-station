# TEMPORARY diagnostic workflow for the instrumented ZDiagEntityTest fixture.

name: ZDiag Instrumented

on:
  push:
    branches: [ 'zdiag-instr/**' ]
  workflow_dispatch:

jobs:
  zdiag:
    name: instr ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - ZDiagSpawnDeleteEntityCountProfile
          - ZDiagSameSpotProfile

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run ${{ matrix.test }}
      timeout-minutes: 100
      run: |
        export DOTNET_gcServer=1
        set +e
        dotnet test --no-build --configuration DebugOpt \
          Content.IntegrationTests/Content.IntegrationTests.csproj \
          --filter "FullyQualifiedName~ZDiagEntityTest.${{ matrix.test }}" \
          --logger "console;verbosity=detailed" \
          -- NUnit.ConsoleOut=0
        echo "ZDIAG_EXIT=$?"
