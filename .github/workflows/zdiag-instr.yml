# TEMPORARY diagnostic workflow. Delete before merging.

name: ZDiag Instrumented

on:
  push:
    branches: [ 'zdiag-instr/**' ]
  workflow_dispatch:

jobs:
  zdiag:
    name: instr ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - ZDiagSameSpotTicks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4.2.2
    - run: git submodule update --init --recursive
    - uses: space-wizards/submodule-dependency@v0.1.5
    - run: cd RobustToolbox/ && git submodule update --init --recursive
    - uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x
    - run: dotnet restore
    - run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run ${{ matrix.test }}
      continue-on-error: true
      timeout-minutes: 40
      env:
        DOTNET_gcServer: '1'
        # Hard-cap the managed heap so the runtime throws OOM instead of the OS
        # SIGKILLing the whole job before diagnostics can be printed. 9 GB.
        DOTNET_GCHeapHardLimit: '240000000'
      run: |
        (while true; do echo "MEMSAMPLE t=$(date +%s) $(free -m | awk '/^Mem:/{printf "used=%s avail=%s", $3, $7}')" >> mem.log; sleep 10; done) &
        set +e
        timeout 35m dotnet test --no-build --configuration DebugOpt \
          Content.IntegrationTests/Content.IntegrationTests.csproj \
          --filter "FullyQualifiedName~ZDiagSameSpot.${{ matrix.test }}" \
          --logger "console;verbosity=detailed" > run.log 2>&1
        echo "TEST_EXIT=$?"

    - name: Diagnostics
      if: always()
      run: |
        echo "=================== ZDIAG"
        grep -a "ZDIAG" run.log | tail -60 || true
        echo "=================== memory"
        tail -60 mem.log || true
        echo "=================== errors"
        grep -aiE "\[ERRO\]|exception|OutOfMemory|Assert" run.log | tail -60 || true
        echo "=================== tail"
        tail -c 20000 run.log || true

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: run-log-${{ matrix.test }}
        path: |
          run.log
          mem.log
        retention-days: 5
        compression-level: 9
